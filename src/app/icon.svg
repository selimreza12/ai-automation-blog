<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Deep Zinc Background with rounded corners -->
  <rect width="256" height="256" rx="56" fill="#09090b" />
  
  <!-- Subtle green glow behind the icon -->
  <circle cx="128" cy="128" r="60" fill="#10b981" opacity="0.15" />
  
  <!-- Emerald Green CPU / Microchip Icon -->
  <g stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="72" y="72" width="112" height="112" rx="16" />
    <!-- Top Pins -->
    <line x1="104" y1="72" x2="104" y2="40" />
    <line x1="152" y1="72" x2="152" y2="40" />
    <!-- Bottom Pins -->
    <line x1="104" y1="184" x2="104" y2="216" />
    <line x1="152" y1="184" x2="152" y2="216" />
    <!-- Left Pins -->
    <line x1="72" y1="104" x2="40" y2="104" />
    <line x1="72" y1="152" x2="40" y2="152" />
    <!-- Right Pins -->
    <line x1="184" y1="104" x2="216" y2="104" />
    <line x1="184" y1="152" x2="216" y2="152" />
  </g>
</svg>
